[project]
name = "brain"
version = "0.1.0"
description = "A first-class second brain for AI agents: evidence, forgetting, portability."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

# Dependency budget: FOUR runtime dependencies (IMPLEMENTATION-PLAN.md §2.1).
# sqlite3/hashlib/pathlib/os/ctypes are stdlib; ripgrep and git are system binaries.
# No embedding library, no vector store, no reranker, no TUI framework.
dependencies = [
    "typer>=0.15",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "mcp>=1.2",
]

[project.scripts]
brain = "brain.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "crash: fault-injection tests that fork and os._exit mid-protocol",
    "slow: tests that take more than a second",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src/brain"]
strict = true
warn_unreachable = true
